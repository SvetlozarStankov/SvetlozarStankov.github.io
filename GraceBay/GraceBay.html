
<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
		<title>Amaris Grace Bay LXR Hotels &amp; Resorts - Virtual Tour</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, minimal-ui" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />

		<style type="text/css">
			/* Welcome screen */
			#welcome-overlay {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				background: rgba(255, 255, 255, 0.85);
				z-index: 10000;
				display: flex;
				justify-content: center;
				align-items: center;
				backdrop-filter: blur(3px);
				-webkit-backdrop-filter: blur(3px);
				transition: opacity 0.4s ease, visibility 0.4s ease;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			}

			#welcome-overlay.hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}

			.welcome-container {
				box-sizing: border-box;
				background: white;
				border-radius: 12px;
				padding: 30px;
				max-width: 500px;
				width: 85%;
				max-height: 90vh;
				overflow-y: auto;
				box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
				position: relative;
				text-align: center;
				border: 1px solid rgba(0, 0, 0, 0.08);
			}

			.welcome-header h1 {
				color: #1a365d;
				font-size: 1.8em;
				margin: 0 0 15px;
				font-weight: 600;
				line-height: 1.3;
			}

			.brand-subtitle {
				color: #718096;
				font-size: 0.95em;
				font-weight: 500;
				margin-bottom: 25px;
				display: block;
				letter-spacing: 0.5px;
			}

			.instructions-list {
				margin: 25px 0;
				padding: 0;
				list-style: none;
			}

			.instructions-list li {
				margin-bottom: 12px;
				color: #4a5568;
				font-size: 1em;
				line-height: 1.5;
				padding-left: 24px;
				text-align: left;
				position: relative;
			}

			.instructions-list li:before {
				content: "\2022";
				color: #4299e1;
				font-size: 1.5em;
				position: absolute;
				left: 0;
				top: -3px;
			}

			#start-tour-btn {
				background: #2d3748;
				color: white;
				border: none;
				padding: 14px 40px;
				font-size: 1em;
				font-weight: 500;
				border-radius: 8px;
				cursor: pointer;
				transition: all 0.2s ease;
				margin-top: 15px;
				letter-spacing: 0.5px;
			}

			#start-tour-btn:hover {
				background: #4a5568;
				transform: translateY(-1px);
			}

			.close-btn {
				position: absolute;
				top: 12px;
				right: 12px;
				background: none;
				width: 32px;
				height: 32px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 20px;
				color: #718096;
				cursor: pointer;
				transition: all 0.2s ease;
				border: 1px solid transparent;
			}

			.close-btn:hover {
				color: #2d3748;
				border-color: #e2e8f0;
				background: #f7fafc;
			}

			/* Image popup */
			.popup-overlay {
				display: none;
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.85);
				z-index: 10001;
				justify-content: center;
				align-items: center;
				backdrop-filter: blur(5px);
				-webkit-backdrop-filter: blur(5px);
			}

			.popup-content {
				position: relative;
				max-width: 90%;
				max-height: 90%;
				background: white;
				border-radius: 12px;
				overflow: hidden;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			}

			.popup-image {
				display: block;
				max-width: 100%;
				max-height: 80vh;
				width: auto;
				height: auto;
				margin: 0 auto;
			}

			.popup-close {
				position: absolute;
				top: 12px;
				right: 12px;
				background: rgba(0, 0, 0, 0.7);
				color: white;
				width: 36px;
				height: 36px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 20px;
				cursor: pointer;
				z-index: 2;
				transition: all 0.2s ease;
				border: none;
			}

			.popup-close:hover {
				background: rgba(0, 0, 0, 0.9);
				transform: scale(1.1);
			}

			.popup-loading {
				color: white;
				font-size: 16px;
				background: rgba(0, 0, 0, 0.7);
				padding: 10px 20px;
				border-radius: 20px;
				margin: 20px;
			}

			.popup-caption {
				padding: 15px;
				text-align: center;
				background: white;
				color: #333;
				font-size: 14px;
				max-width: 600px;
				margin: 0 auto;
			}

			.popup-title {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
				color: white;
				padding: 20px;
				margin: 0;
				font-size: 1.2em;
				font-weight: 500;
				pointer-events: none;
			}

			/* Mobile responsiveness */
			@media (max-width: 768px) {
				.welcome-container {
					padding: 25px 20px;
					width: 90%;
				}

				.welcome-header h1 {
					font-size: 1.5em;
				}

				.instructions-list li {
					font-size: 0.95em;
				}

				#start-tour-btn {
					padding: 12px 30px;
					width: 100%;
				}

				.popup-content {
					max-width: 95%;
					max-height: 95%;
				}
			}

			@media (max-width: 480px) {
				.welcome-container {
					padding: 35px 15px 20px;
				}

				.welcome-header h1 {
					font-size: 1.3em;
				}

				.instructions-list li {
					padding-left: 20px;
					font-size: 0.9em;
				}
			}

			/* Original Object2VR styles */
			body, div, h1, h2, h3, span, p {
				font-family: Verdana, Arial, Helvetica, sans-serif;
				color: #000000;
			}

			html {
				height: 100%;
			}

			body {
				height: 100%;
				margin: 0;
				overflow: hidden;
				font-size: 10pt;
				background: #ffffff;
			}

			table, tr, td {
				font-size: 10pt;
				border-color: #777777;
				background: #dddddd;
				color: #000000;
				border-style: solid;
				border-width: 2px;
				padding: 5px;
				border-collapse: collapse;
			}

			h1 {
				font-size: 18pt;
			}

			h2 {
				font-size: 14pt;
			}

			.warning {
				font-weight: bold;
			}

			/* Keep welcome screen typography independent of Object2VR defaults */
			#welcome-overlay,
			#welcome-overlay div,
			#welcome-overlay h1,
			#welcome-overlay span,
			#welcome-overlay li,
			#welcome-overlay button {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			}

			#welcome-overlay h1 {
				font-size: 1.8em;
			}

			#welcome-overlay .welcome-header h1 {
				font-size: 1.8em;
			}
		</style>

		<script type="text/javascript">
			// Original Object2VR mobile URL-bar handling
			function hideUrlBar() {
				var p = String(navigator.platform);
				var container = document.getElementById("container");

				if (p === "iPad" || p === "iPhone" || p === "iPod touch") {
					var v = (navigator.appVersion).match(/OS (\d+)_(\d+)_?(\d+)?/);

					if (v && parseInt(v[1], 10) >= 7) {
						if (container) {
							container.style.top = "0px";
							container.style.left = "0px";
							container.style.width = window.innerWidth + "px";
							container.style.height = window.innerHeight + "px";
						}

						if (typeof obj !== "undefined" && obj) {
							obj.setViewerSize(window.innerWidth, window.innerHeight);
						}

						window.scrollTo(0, 0);
					} else {
						if (container) {
							var cheight;

							switch (window.innerHeight) {
								case 208: cheight = 268; break;
								case 260: cheight = 320; break;
								case 336: cheight = 396; break;
								case 356: cheight = 416; break;
								case 424: cheight = 484; break;
								case 444: cheight = 504; break;
								default: cheight = window.innerHeight;
							}

							if (cheight &&
								(container.offsetHeight !== cheight ||
								window.innerHeight !== cheight)) {
								container.style.height = cheight + "px";
							}
						}

						document.body.style.marginTop = "1px";
						window.scrollTo(0, 1);
					}
				}
			}

			// Close welcome screen
			function closeWelcomeScreen() {
				var overlay = document.getElementById("welcome-overlay");

				if (overlay) {
					overlay.classList.add("hidden");
					overlay.setAttribute("aria-hidden", "true");
				}
			}

			// Image popup functionality
			function initPopup() {
				if (document.getElementById("imagePopup")) {
					return;
				}

				var popupHTML =
					'<div class="popup-overlay" id="imagePopup" role="dialog" aria-modal="true" aria-label="Image preview">' +
						'<div class="popup-content" id="popupContent">' +
							'<button type="button" class="popup-close" id="popupClose" aria-label="Close image">&times;</button>' +
							'<div class="popup-loading" id="popupLoading">Loading image...</div>' +
							'<img class="popup-image" id="popupImage" alt="" style="display:none;">' +
							'<div class="popup-caption" id="popupCaption" style="display:none;"></div>' +
							'<h3 class="popup-title" id="popupTitle" style="display:none;"></h3>' +
						'</div>' +
					'</div>';

				document.body.insertAdjacentHTML("beforeend", popupHTML);

				var popup = document.getElementById("imagePopup");
				var popupClose = document.getElementById("popupClose");
				var popupImage = document.getElementById("popupImage");
				var popupCaption = document.getElementById("popupCaption");
				var popupLoading = document.getElementById("popupLoading");
				var popupTitle = document.getElementById("popupTitle");

				function closeImagePopup() {
					popup.style.display = "none";
					popupImage.onload = null;
					popupImage.onerror = null;
					popupImage.removeAttribute("src");
					document.body.style.overflow = "hidden";
				}

				popupClose.addEventListener("click", closeImagePopup);

				popup.addEventListener("click", function(event) {
					if (event.target === popup) {
						closeImagePopup();
					}
				});

				window.openImagePopup = function(imageUrl, caption, title) {
					popupLoading.style.display = "block";
					popupLoading.textContent = "Loading image...";
					popupImage.style.display = "none";
					popupCaption.style.display = "none";
					popupTitle.style.display = "none";

					popup.style.display = "flex";

					popupImage.onload = function() {
						popupLoading.style.display = "none";
						popupImage.style.display = "block";

						if (caption) {
							popupCaption.textContent = caption;
							popupCaption.style.display = "block";
						}

						if (title) {
							popupTitle.textContent = title;
							popupTitle.style.display = "block";
						}
					};

					popupImage.onerror = function() {
						popupLoading.textContent = "Error loading image";
					};

					popupImage.src = imageUrl;
				};

				// Intercept image links explicitly opened in a new window.
				var originalOpen = window.open;

				window.open = function(url, target, features) {
					if (typeof url === "string") {
						var cleanUrl = url.split("?")[0].split("#")[0].toLowerCase();
						var imageExtensions = [
							".jpg", ".jpeg", ".png", ".gif",
							".bmp", ".webp", ".svg"
						];

						var isImage = imageExtensions.some(function(ext) {
							return cleanUrl.slice(-ext.length) === ext;
						});

						if (isImage && (!target || target === "_blank")) {
							window.openImagePopup(url, "", "");
							return null;
						}
					}

					return originalOpen.apply(window, arguments);
				};

				return closeImagePopup;
			}

			if (window.addEventListener) {
				window.addEventListener("load", hideUrlBar);
				window.addEventListener("resize", hideUrlBar);
				window.addEventListener("orientationchange", hideUrlBar);
				window.addEventListener("load", initPopup);
			}
		</script>
	</head>

	<body>
		<!-- Welcome screen -->
		<div id="welcome-overlay"
			aria-labelledby="welcome-title"
			role="dialog"
			aria-modal="true">

			<div class="welcome-container">
				<button type="button"
					class="close-btn"
					onclick="closeWelcomeScreen()"
					aria-label="Close welcome screen">&times;</button>

				<div class="welcome-header">
					<h1 id="welcome-title">
						Welcome to<br>
						Amaris Grace Bay<br>
						LXR Hotels &amp; Resorts
					</h1>

					<span class="brand-subtitle">Virtual Property Tour</span>

					<ul class="instructions-list">
						<li>Drag to rotate the building up/down and side-to-side</li>
						<li>Click on apartments to view details</li>
						<li>Use mouse wheel or pinch to zoom</li>
					</ul>
				</div>

				<button type="button"
					id="start-tour-btn"
					onclick="closeWelcomeScreen()"
					aria-label="Start the virtual tour">
					Start Exploring
				</button>
			</div>
		</div>

		<!-- Object2VR player scripts -->
		<script type="text/javascript" src="object2vr_player.js"></script>
		<script type="text/javascript" src="skin.js"></script>

		<div id="container" style="width:100%;height:100%;" tabindex="-1">
			This content requires HTML5 &amp; Javascript or Adobe Flash Player Version 9 or higher.
		</div>

		<script type="text/javascript">
			// Create the Object2VR player
			var obj = new object2vrPlayer("container");

			// Add the skin
			var skin = new object2vrSkin(obj);

			// Load the configuration
			obj.readConfigUrl("GraceBay.xml");

			// Hide the URL bar on iPhone
			setTimeout(function() {
				hideUrlBar();
			}, 10);

			// Keyboard controls
			document.addEventListener("keydown", function(event) {
				if (event.key === "Escape") {
					closeWelcomeScreen();

					var popup = document.getElementById("imagePopup");
					if (popup && popup.style.display === "flex") {
						popup.style.display = "none";

						var popupImage = document.getElementById("popupImage");
						if (popupImage) {
							popupImage.removeAttribute("src");
						}
					}
				}
			});

			// Close welcome screen when clicking outside the card
			document.getElementById("welcome-overlay").addEventListener("click", function(event) {
				if (event.target === this) {
					closeWelcomeScreen();
				}
			});
		</script>

		<noscript>
			<p><b>Please enable Javascript!</b></p>
		</noscript>
	</body>
</html>
