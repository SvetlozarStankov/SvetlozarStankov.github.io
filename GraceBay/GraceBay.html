<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
		<title>Amaris Grace Bay LXR Hotels & Resorts - Virtual Tour</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, minimal-ui" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />

		<style type="text/css">

			/* =========================================
			   WELCOME SCREEN
			   ========================================= */

			#welcome-overlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(255, 255, 255, 0.85);
				z-index: 10000;
				display: flex;
				justify-content: center;
				align-items: center;
				backdrop-filter: blur(3px);
				transition: opacity 0.4s ease, visibility 0.4s ease;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			}

			.welcome-container {
				background: white;
				border-radius: 12px;
				padding: 30px;
				max-width: 500px;
				width: 85%;
				box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
				position: relative;
				text-align: center;
				border: 1px solid rgba(0, 0, 0, 0.08);
			}

			.welcome-header h1 {
				color: #1a365d;
				font-size: 1.8em;
				margin: 0 0 15px 0;
				font-weight: 600;
				line-height: 1.3;
			}

			.brand-subtitle {
				color: #718096;
				font-size: 0.95em;
				font-weight: 500;
				margin-bottom: 25px;
				display: block;
				letter-spacing: 0.5px;
			}

			.instructions-list {
				margin: 25px 0;
				padding: 0;
				list-style: none;
			}

			.instructions-list li {
				margin-bottom: 12px;
				color: #4a5568;
				font-size: 1em;
				line-height: 1.5;
				padding-left: 24px;
				text-align: left;
				position: relative;
			}

			.instructions-list li:before {
				content: "•";
				color: #4299e1;
				font-size: 1.5em;
				position: absolute;
				left: 0;
				top: -3px;
			}

			#start-tour-btn {
				background: #2d3748;
				color: white;
				border: none;
				padding: 14px 40px;
				font-size: 1em;
				font-weight: 500;
				border-radius: 8px;
				cursor: pointer;
				transition: all 0.2s ease;
				margin-top: 15px;
				letter-spacing: 0.5px;
			}

			#start-tour-btn:hover {
				background: #4a5568;
				transform: translateY(-1px);
			}

			.close-btn {
				position: absolute;
				top: 12px;
				right: 12px;
				background: none;
				width: 32px;
				height: 32px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 20px;
				color: #718096;
				cursor: pointer;
				transition: all 0.2s ease;
				border: 1px solid transparent;
			}

			.close-btn:hover {
				color: #2d3748;
				border-color: #e2e8f0;
				background: #f7fafc;
			}


			/* =========================================
			   IMAGE POPUP
			   ========================================= */

			.popup-overlay {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.85);
				z-index: 10001;
				justify-content: center;
				align-items: center;
				backdrop-filter: blur(5px);
			}

			.popup-content {
				position: relative;
				max-width: 90%;
				max-height: 90%;
				background: white;
				border-radius: 12px;
				overflow: hidden;
				box-shadow: 0 20px 60px rgba(0,0,0,0.3);
			}

			.popup-image {
				display: block;
				max-width: 100%;
				max-height: 80vh;
				width: auto;
				height: auto;
				margin: 0 auto;
			}

			.popup-close {
				position: absolute;
				top: 12px;
				right: 12px;
				background: rgba(0,0,0,0.7);
				color: white;
				width: 36px;
				height: 36px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 20px;
				cursor: pointer;
				z-index: 2;
				transition: all 0.2s ease;
				border: none;
			}

			.popup-close:hover {
				background: rgba(0,0,0,0.9);
				transform: scale(1.1);
			}

			.popup-loading {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				color: white;
				font-size: 16px;
				background: rgba(0,0,0,0.7);
				padding: 10px 20px;
				border-radius: 20px;
			}

			.popup-caption {
				padding: 15px;
				text-align: center;
				background: white;
				color: #333;
				font-size: 14px;
				max-width: 600px;
				margin: 0 auto;
			}

			.popup-title {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
				color: white;
				padding: 20px;
				margin: 0;
				font-size: 1.2em;
				font-weight: 500;
			}


			/* =========================================
			   MOBILE
			   ========================================= */

			@media (max-width: 768px) {

				.welcome-container {
					padding: 25px 20px;
					width: 90%;
				}

				.welcome-header h1 {
					font-size: 1.5em;
				}

				.instructions-list li {
					font-size: 0.95em;
				}

				#start-tour-btn {
					padding: 12px 30px;
					width: 100%;
				}

				.popup-content {
					max-width: 95%;
					max-height: 95%;
				}
			}

			@media (max-width: 480px) {

				.welcome-container {
					padding: 20px 15px;
				}

				.welcome-header h1 {
					font-size: 1.3em;
				}

				.instructions-list li {
					padding-left: 20px;
					font-size: 0.9em;
				}
			}


			/* =========================================
			   ORIGINAL OBJECT2VR STYLES
			   ========================================= */

			body, div, h1, h2, h3, span, p {
				font-family: Verdana,Arial,Helvetica,sans-serif;
				color: #000000;
			}

			html {
				height: 100%;
			}

			body {
				height: 100%;
				margin: 0px;
				overflow: hidden;
				font-size: 10pt;
				background: #ffffff;
			}

			table,tr,td {
				font-size: 10pt;
				border-color: #777777;
				background: #dddddd;
				color: #000000;
				border-style: solid;
				border-width: 2px;
				padding: 5px;
				border-collapse: collapse;
			}

			h1 {
				font-size: 18pt;
			}

			h2 {
				font-size: 14pt;
			}

			.warning {
				font-weight: bold;
			}

		</style>


		<script type="text/javascript">

			/* =========================================
			   HIDE URL BAR ON iOS
			   ========================================= */

			function hideUrlBar() {

				var p = String(navigator.platform);

				container = document.getElementById("container");

				if (p === 'iPad' || p === 'iPhone' || p === 'iPod touch') {

					var v = (navigator.appVersion).match(/OS (\d+)_(\d+)_?(\d+)?/);

					if (parseInt(v[1], 10) >= 7) {

						if (container) {
							container.style.top = "0px";
							container.style.left = "0px";
							container.style.width = window.innerWidth + "px";
							container.style.height = window.innerHeight + "px";
						}

						if (obj) {
							obj.setViewerSize(
								window.innerWidth,
								window.innerHeight
							);
						}

						window.scrollTo(0, 0);

					} else {

						if (container) {

							var cheight;

							switch(window.innerHeight) {
								case 208: cheight = 268; break;
								case 260: cheight = 320; break;
								case 336: cheight = 396; break;
								case 356: cheight = 416; break;
								case 424: cheight = 484; break;
								case 444: cheight = 504; break;
								default: cheight = window.innerHeight;
							}

							if (
								cheight &&
								(
									container.offsetHeight != cheight ||
									window.innerHeight != cheight
								)
							) {
								container.style.height = cheight + "px";
							}
						}

						document.getElementsByTagName("body")[0].style.marginTop = "1px";

						window.scrollTo(0, 1);
					}
				}
			}


			/* =========================================
			   CLOSE WELCOME SCREEN
			   ========================================= */

			function closeWelcomeScreen() {

				var overlay = document.getElementById('welcome-overlay');

				overlay.style.opacity = '0';
				overlay.style.visibility = 'hidden';
				overlay.setAttribute('aria-hidden', 'true');

				document.getElementById('container').focus();
			}


			/* =========================================
			   IMAGE POPUP
			   ========================================= */

			function initPopup() {

				var popupHTML = `
					<div class="popup-overlay" id="imagePopup">

						<div class="popup-close" id="popupClose">
							&times;
						</div>

						<div class="popup-content" id="popupContent">

							<div class="popup-loading" id="popupLoading">
								Loading image...
							</div>

							<img
								class="popup-image"
								id="popupImage"
								style="display:none;"
							>

							<div
								class="popup-caption"
								id="popupCaption"
								style="display:none;">
							</div>

							<h3
								class="popup-title"
								id="popupTitle"
								style="display:none;">
							</h3>

						</div>
					</div>
				`;

				document.body.insertAdjacentHTML(
					'beforeend',
					popupHTML
				);

				var popup = document.getElementById('imagePopup');
				var popupClose = document.getElementById('popupClose');
				var popupImage = document.getElementById('popupImage');
				var popupCaption = document.getElementById('popupCaption');
				var popupLoading = document.getElementById('popupLoading');
				var popupTitle = document.getElementById('popupTitle');


				/* Close button */

				popupClose.addEventListener(
					'click',
					closeImagePopup
				);


				/* Close when clicking outside image */

				popup.addEventListener('click', function(e) {

					if (e.target === popup) {
						closeImagePopup();
					}

				});


				/* Open image */

				window.openImagePopup = function(
					imageUrl,
					caption,
					title
				) {

					popupLoading.style.display = 'block';

					popupImage.style.display = 'none';
					popupCaption.style.display = 'none';
					popupTitle.style.display = 'none';

					popup.style.display = 'flex';


					popupImage.onload = function() {

						popupLoading.style.display = 'none';

						popupImage.style.display = 'block';

						if (caption) {
							popupCaption.innerHTML = caption;
							popupCaption.style.display = 'block';
						}

						if (title) {
							popupTitle.innerHTML = title;
							popupTitle.style.display = 'block';
						}

						document.body.style.overflow = 'hidden';
					};


					popupImage.onerror = function() {

						popupLoading.innerHTML =
							'Error loading image';

					};


					popupImage.src = imageUrl;
				};


				/* Close image */

				function closeImagePopup() {

					popup.style.display = 'none';

					popupImage.src = '';

					document.body.style.overflow = '';
				}


				/* Intercept image links */

				var originalOpen = window.open;

				window.open = function(
					url,
					target,
					features
				) {

					var imageExtensions = [
						'.jpg',
						'.jpeg',
						'.png',
						'.gif',
						'.bmp',
						'.webp',
						'.svg'
					];

					var isImage = imageExtensions.some(
						function(ext) {
							return url.toLowerCase().includes(ext);
						}
					);


					if (
						isImage &&
						(!target || target === '_blank')
					) {

						openImagePopup(
							url,
							'',
							''
						);

						return null;
					}


					return originalOpen.apply(
						window,
						arguments
					);
				};


				return closeImagePopup;
			}


			/* =========================================
			   EVENTS
			   ========================================= */

			if (window.addEventListener) {

				window.addEventListener(
					"load",
					hideUrlBar
				);

				window.addEventListener(
					"resize",
					hideUrlBar
				);

				window.addEventListener(
					"orientationchange",
					hideUrlBar
				);

				window.addEventListener(
					"load",
					initPopup
				);
			}

		</script>

	</head>


	<body>


		<!-- =========================================
		     WELCOME SCREEN
		     ========================================= -->

		<div
			id="welcome-overlay"
			aria-labelledby="welcome-title"
			role="dialog"
			aria-modal="true">

			<div class="welcome-container">

				<div
					class="close-btn"
					onclick="closeWelcomeScreen()"
					aria-label="Close welcome screen"
					tabindex="0"
					role="button">
					×
				</div>


				<div class="welcome-header">

					<h1 id="welcome-title">
						Welcome to<br>
						Amaris Grace Bay<br>
						LXR Hotels & Resorts
					</h1>

					<span class="brand-subtitle">
						Virtual Property Tour
					</span>


					<ul class="instructions-list">

						<li>
							Drag to rotate the building up/down and side-to-side
						</li>

						<li>
							Click on apartments to view details
						</li>

						<li>
							Use mouse wheel or pinch to zoom
						</li>

					</ul>

				</div>


				<button
					id="start-tour-btn"
					onclick="closeWelcomeScreen()"
					aria-label="Start the virtual tour">

					Start Exploring

				</button>

			</div>

		</div>


		<!-- =========================================
		     OBJECT2VR
		     ========================================= -->

		<script
			type="text/javascript"
			src="object2vr_player.js">
		</script>

		<script
			type="text/javascript"
			src="skin.js">
		</script>


		<div
			id="container"
			style="width:100%;height:100%;"
			tabindex="-1">

			This content requires HTML5 &amp; Javascript or Adobe Flash Player Version 9 or higher.

		</div>


		<script type="text/javascript">

			/* Create Object2VR player */

			obj = new object2vrPlayer("container");


			/* Add skin */

			skin = new object2vrSkin(obj);


			/* Load configuration */

			obj.readConfigUrl("GraceBay.xml");


			/* Hide URL bar */

			setTimeout(function() {
				hideUrlBar();
			}, 10);


			/* =========================================
			   KEYBOARD SUPPORT
			   ========================================= */

			document.addEventListener(
				'keydown',
				function(event) {

					if (event.key === 'Escape') {

						closeWelcomeScreen();


						var popup =
							document.getElementById('imagePopup');

						if (
							popup &&
							popup.style.display === 'flex'
						) {

							popup.style.display = 'none';

							document.body.style.overflow = '';
						}
					}
				}
			);


			/* =========================================
			   CLOSE WELCOME BY CLICKING OUTSIDE
			   ========================================= */

			document
				.getElementById('welcome-overlay')
				.addEventListener(
					'click',
					function(event) {

						if (event.target === this) {
							closeWelcomeScreen();
						}

					}
				);


			/* =========================================
			   ENTER / SPACE KEY SUPPORT
			   ========================================= */

			document
				.querySelectorAll(
					'.close-btn, #start-tour-btn, .popup-close'
				)
				.forEach(function(element) {

					element.addEventListener(
						'keydown',
						function(event) {

							if (
								event.key === 'Enter' ||
								event.key === ' '
							) {

								event.preventDefault();


								if (
									this.classList.contains(
										'popup-close'
									)
								) {

									var popup =
										document.getElementById(
											'imagePopup'
										);

									if (popup) {
										popup.style.display = 'none';
									}

								} else {

									closeWelcomeScreen();
								}
							}
						}
					);

				});

		</script>


		<noscript>
			<p>
				<b>Please enable Javascript!</b>
			</p>
		</noscript>


	</body>
</html>
